[mypy]
python_version = 3.12
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
check_untyped_defs = True
no_implicit_optional = True

# alembic env.py / versions are generated/scaffold code, not hand-maintained
# application logic -- excluded to keep signal high on the code that matters.
exclude = ^app/alembic/

