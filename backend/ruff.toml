target-version = "py312"
line-length = 110

[lint]
# A focused, practical rule set rather than ruff's full catalog: correctness
# (pyflakes, a subset of pycodestyle), import hygiene, and a few high-signal
# modernization/bug-pattern checks. Opinionated style/doc rulesets (D, ANN,
# PLR, TRY, ...) are intentionally left out as not worth the churn right now.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
  "B008", # FastAPI's Depends()/Query() pattern relies on call-in-default-arg
  "UP042", # str+Enum (not StrEnum) is deliberate here; ruff flags the switch as unsafe/behavior-changing
]

[lint.per-file-ignores]
"tests/*" = ["B"]
"app/alembic/versions/*" = ["E501"]
# SQLAlchemy relationship() targets are quoted forward refs resolved at
# mapper-configuration time via the shared registry (see app/models/__init__.py),
# not via an import in each module -- importing them here would be circular.
"app/models/*" = ["F821"]
