name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/test
      JWT_SECRET_KEY: ci-test-secret-not-used-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "1440"
      PAT_ENCRYPTION_KEY: bFLrBx9QAP_EXh8Y24O2qNPKRQe_rlChTsDt-cd5I0U=
      GROQ_API_KEY: ci-test-key-not-used-in-production
      CORS_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy app

      - name: Test with coverage (pytest)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov/

  frontend:
    name: Frontend (oxlint, tsc, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Test with coverage (vitest)
        run: npm run test:coverage

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Build
        run: npm run build
